# CI for the published library: lint, typecheck, unit tests, build, and an
# MCP smoke session against the built bin (bun).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14" # pinned
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # One real MCP session against the built bin: the bundled manifest AND
      # examples index must load from dist/, or `stimeo mcp` is dead on arrival.
      - run: bun run smoke:mcp
